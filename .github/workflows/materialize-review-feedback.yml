name: Materialize review feedback fix
on:
  push:
    branches: [fix/review-progress-and-approvals]
    paths: [.github/workflows/materialize-review-feedback.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'ts-droid/vendora-agreements' && github.ref == 'refs/heads/fix/review-progress-and-approvals'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-progress-and-approvals
          fetch-depth: 0
      - name: Apply checksum-verified source update
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('branch', '--show-current') == 'fix/review-progress-and-approvals'
          base = 'd5db3b979548e025bcdc18ae30f13e6623dc50fd'
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          encoded = ''.join(pathlib.Path(f'.maintenance/review-feedback/part-{i}.b64').read_text().strip() for i in range(3))
          diff = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(diff) == 62082
          assert hashlib.sha256(diff).hexdigest() == '942edf54fbc7ac8b37f9b23864f55003602526fbee69d10213b35f1e9d11ab13'
          patch = pathlib.Path('/tmp/review-feedback-verified.patch')
          patch.write_bytes(diff)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          subprocess.run(['git', 'rm', '-r', '.maintenance/review-feedback', '.github/workflows/materialize-review-feedback.yml'], check=True)
          expected = {'ai.js','index.html','workflow-api.js','workflow-core.js','workflow-ui.js','test/workflow-api.test.js','test/review-feedback.test.js'}
          assert set(git('diff', '--cached', '--name-only', base).splitlines()) == expected
          assert git('write-tree') == '0af4208b3fa4c6a54d981556778eb637304d77a4'
          assert not git('diff', '--name-only')
          PY
      - name: Commit feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: show review progress and make wording decisions explicit'
          git push origin HEAD:refs/heads/fix/review-progress-and-approvals
