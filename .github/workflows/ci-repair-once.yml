name: Apply verified regression fixes once
on:
  push:
    branches: [fix/workflow-ci-regressions]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'ts-droid/vendora-agreements' && github.ref == 'refs/heads/fix/workflow-ci-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply exact reviewed edits with before and after blob checksums
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const hash = s => crypto.createHash('sha1').update('blob ' + Buffer.byteLength(s) + '\0').update(s).digest('hex');
          const edits = [
            {
              path: 'workflow-ui.js',
              before: '345b56776bd8dcfd1a2b744baf1a12fb8981de97',
              after: 'd1a733e677b20f503617d22bff88a20ced37266f',
              replacements: [[
                '    hydrateForm(row.type,row.data);',
                "    // Opening or refreshing a saved agreement must reveal its own workspace, not\n    // leave actionable controls in the default (or previously selected) hidden tab.\n    switchTab(row.type==='da'?0:row.type==='ra'?1:2);\n    hydrateForm(row.type,row.data);"
              ]]
            },
            {
              path: 'test/lawyer-changes.test.js',
              before: '2082added2ce9a42887bb9fd29cee119cb7b1284',
              after: 'b1cbb334ead9b189688e55356bb0d5bf24bec4c1',
              replacements: [[
                '  assert.match(html, /not a commercial agent/);\n  assert.match(html, /no non-compete/);',
                "  // Clause wording now comes from the shared browser/server source, not an\n  // inline literal in index.html. Verify the real source without duplicating it.\n  assert.match(LC.standardClauseText('ra', 'ra.s13b.no_compensation', { _type: 'ra' }), /not a commercial agent/);\n  assert.match(LC.standardClauseText('ra', 'ra.s13c.after_end', { _type: 'ra' }), /no non-compete/);"
              ], [
                '    assert.match(report.text, /SCC arbitration/);',
                '    assert.match(report.text, /SCC arbitration/);\n    assert.match(report.text, /not a commercial agent/);\n    assert.match(report.text, /no non-compete/);'
              ]]
            },
            {
              path: 'test/workflow-api.test.js',
              before: 'd1829595dfa3b55826da2b4590722d359b12d235',
              after: '4159b4e0651d0ba19d9bd1c0b210b6db3f6c2e46',
              replacements: [[
                "    assert.equal(await page.evaluate(()=>window._editing.base.pay),'45');",
                "    assert.equal(await page.evaluate(()=>window._editing.base.pay),'45');\n    assert.equal(await page.evaluate(()=>activeTab),1,'reopening a reseller agreement selects its visible workspace');\n    await page.waitForSelector('#wf_panel_ra [data-wf=\"invite\"]',{visible:true});"
              ]]
            }
          ];
          const prepared = edits.map(edit => {
            let text = fs.readFileSync(edit.path, 'utf8');
            if (hash(text) !== edit.before) throw new Error('Source changed: ' + edit.path);
            for (const [oldText, newText] of edit.replacements) {
              if (text.split(oldText).length !== 2) throw new Error('Non-unique replacement: ' + edit.path);
              text = text.replace(oldText, () => newText);
            }
            if (hash(text) !== edit.after) throw new Error('Output checksum mismatch: ' + edit.path);
            return [edit.path, text];
          });
          for (const [path, text] of prepared) fs.writeFileSync(path, text);
          NODE
          node --check workflow-ui.js
          node --check test/lawyer-changes.test.js
          node --check test/workflow-api.test.js
      - name: Commit source changes and remove this one-time transport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ci-repair-once.yml
          git add workflow-ui.js test/lawyer-changes.test.js test/workflow-api.test.js
          git diff --cached --check
          git commit -m 'fix: restore agreement workspace on reopen and verify shared clause wording'
          git push origin HEAD:refs/heads/fix/workflow-ci-regressions
