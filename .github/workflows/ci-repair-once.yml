name: Apply verified customer test completion once
on:
  push:
    branches: [fix/workflow-ci-regressions]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'ts-droid/vendora-agreements' && github.ref == 'refs/heads/fix/workflow-ci-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Include required customer-supplied point of sale and verify persistence
        run: |
          node <<'NODE'
          const fs = require('node:fs'), crypto = require('node:crypto');
          const path = 'test/workflow-api.test.js';
          const hash = s => crypto.createHash('sha1').update('blob ' + Buffer.byteLength(s) + '\0').update(s).digest('hex');
          let text = fs.readFileSync(path, 'utf8');
          if (hash(text) !== '4159b4e0651d0ba19d9bd1c0b210b6db3f6c2e46') throw new Error('Test source changed');
          const edits = [
            ["const submission={...r.state.sent.data,name:'Completed Customer AB'", "const submission={...r.state.sent.data,pos_web:['customer.example.test'],pos_physical:[],name:'Completed Customer AB'"],
            ["    const initial=await good('/api/workflow/'+id);assert.equal(initial.state.items.length,5);const baseline=C.digest(initial.state.baseline);", "    const initial=await good('/api/workflow/'+id);assert.equal(initial.state.items.length,5);const baseline=C.digest(initial.state.baseline);\n    assert.ok(initial.signatureProblems.includes('Minst ett försäljningsställe krävs.'),'customer must still supply an approved point of sale');"],
            ["assert.equal(r.data._proposals.pay.original,'45');", "assert.equal(r.data._proposals.pay.original,'45');assert.deepEqual(r.data.pos_web,['customer.example.test']);"],
            ["assert.match(finalExport.xml,/complete payment/);", "assert.match(finalExport.xml,/complete payment/);assert.match(finalExport.xml,/customer.example.test/);"]
          ];
          for (const [a,b] of edits) {
            if (text.split(a).length !== 2) throw new Error('Non-unique test edit');
            text = text.replace(a, () => b);
          }
          if (hash(text) !== '326d1752f8d4a066b878987eaf1b0e26bae11763') throw new Error('Output mismatch');
          fs.writeFileSync(path,text);
          NODE
          node --check test/workflow-api.test.js
      - name: Commit the test fix on the repair branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ci-repair-once.yml
          git add test/workflow-api.test.js
          git diff --cached --check
          git commit -m 'test: complete customer points of sale before requesting signature'
          git push origin HEAD:refs/heads/fix/workflow-ci-regressions
