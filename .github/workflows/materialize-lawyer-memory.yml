name: Materialize lawyer workspace
on:
  push:
    branches: [feat/lawyer-memory-linked-drafts]
    paths: [.github/workflows/materialize-lawyer-memory.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'ts-droid/vendora-agreements' && github.ref == 'refs/heads/feat/lawyer-memory-linked-drafts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lawyer-memory-linked-drafts
          fetch-depth: 0
      - name: Apply checksum-verified implementation only
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('branch', '--show-current') == 'feat/lawyer-memory-linked-drafts'
          base = 'a6bbddb33c99485b0e4bec5fe9319445e9720e32'
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          encoded = ''.join(pathlib.Path(f'.maintenance/lawyer-memory/patch-{i}.b64').read_text().strip() for i in range(5))
          payload = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(payload) == 93020
          assert hashlib.sha256(payload).hexdigest() == '6a10d7a21e6db0aaecc2604c46c7c8fbfd82d7630e42c33e7145936c45fdd2b1'
          patch = pathlib.Path('/tmp/lawyer-workspace-verified.patch')
          patch.write_bytes(payload)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          subprocess.run(['git', 'rm', '-r', '.maintenance/lawyer-memory', '.github/workflows/materialize-lawyer-memory.yml'], check=True)
          expected = {'ai.js','db.js','docs/lawyer-workspace.md','index.html','lawyer-workspace-api.js','lawyer-workspace-core.js','lawyer-workspace-ui.js','server.js','test/lawyer-workspace-ai.test.js','test/lawyer-workspace-api.test.js','test/lawyer-workspace-core.test.js'}
          assert set(git('diff', '--cached', '--name-only', base).splitlines()) == expected
          assert not git('diff', '--name-only')
          PY
      - name: Commit and push feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: persist lawyer memory and versioned drafts linked to archived agreements'
          git push origin HEAD:refs/heads/feat/lawyer-memory-linked-drafts
