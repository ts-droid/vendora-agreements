name: Repair review test wait
on:
  push:
    branches: [fix/review-progress-and-approvals]
    paths: [.github/workflows/repair-review-test-wait.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'ts-droid/vendora-agreements' && github.ref == 'refs/heads/fix/review-progress-and-approvals'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-progress-and-approvals
      - name: Correct the obsolete wait condition and assert each saved decision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          p=Path('test/workflow-api.test.js')
          before=p.read_bytes()
          assert hashlib.sha256(before).hexdigest()=='c48e96833eefd437f40b666f569ca313806598027c52b71cae9c8c6edce8453b'
          old='''      await page.click('[data-item="'+itemId+'"] [data-wf="'+action+'"]');
                await page.waitForFunction(item=>{const e=document.querySelector('[data-item="'+item+'"]');return e&&!e.querySelector('[data-wf="accept"]');},{},itemId);'''
          # Match indentation independent of this YAML block's visual layout.
          old=old.replace('\n                await','\n      await')
          new='''      // A keep-only finding never had an accept button. Wait for the actual saved
                // decision and released UI, not the absence of that unrelated button.
                await page.waitForFunction(({item,action})=>{const e=document.querySelector('[data-item="'+item+'"] [data-wf="'+action+'"]');return e&&!e.disabled&&!WorkflowActivity.busy();},{},{item:itemId,action});
                await page.click('[data-item="'+itemId+'"] [data-wf="'+action+'"]');
                await page.waitForFunction(item=>{const e=document.querySelector('[data-item="'+item+'"]');return e&&!e.querySelector('[data-wf]')&&!WorkflowActivity.busy();},{},itemId);
                const savedDecision=await good('/api/workflow/'+id);
                assert.equal(savedDecision.state.items.find(item=>item.id===itemId).status,action==='keep'?'kept':'accepted');'''
          new=new.replace('\n                ','\n      ')
          source=before.decode()
          assert source.count(old)==1
          after=source.replace(old,new).encode()
          assert hashlib.sha256(after).hexdigest()=='4deebd16567fe5858e06a7a4101c284f6d57c4c9788d89dd1ec1855691cba817'
          p.write_bytes(after)
          subprocess.run(['git','add',str(p)],check=True)
          subprocess.run(['git','rm','.github/workflows/repair-review-test-wait.yml'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='88bae7246b7d9a0d0955d76ce1f442bacfe65f3f'
          PY
      - name: Commit source repair on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: await actual persisted decisions after explicit keep-only actions'
          git push origin HEAD:refs/heads/fix/review-progress-and-approvals
