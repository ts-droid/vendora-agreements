name: AI accuracy prerequisites
on:
  push:
    branches: [test/live-company-accuracy]
    paths: [.github/workflows/ai-accuracy-prerequisites.yml]
permissions:
  contents: read
jobs:
  prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check availability without reading or logging the secret value
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const available = Boolean(process.env.ANTHROPIC_API_KEY);
          const report = {
            evaluation: 'counterparty-company-extraction',
            status: available ? 'ready_for_live_calls' : 'blocked_missing_credential',
            providerCalls: 0,
            accuracy: null,
            message: available
              ? 'A credential is available to this job. No provider request has been made.'
              : 'ANTHROPIC_API_KEY is unavailable to this GitHub Actions job. No live accuracy result exists.'
          };
          fs.mkdirSync('ai-eval-results', { recursive: true });
          fs.writeFileSync('ai-eval-results/prerequisites.json', JSON.stringify(report, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '# AI accuracy prerequisite check\n\n' + report.message + '\n\nProvider calls: 0. No accuracy score has been calculated.\n');
          console.log(report.message);
          process.exitCode = available ? 0 : 2;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-accuracy-prerequisites
          path: ai-eval-results/
          retention-days: 7
