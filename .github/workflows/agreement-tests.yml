name: Agreement workflow tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agreement_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: agreement_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agreement_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      ANTHROPIC_API_KEY: ''
      DATABASE_URL: ''
      TEST_DATABASE_URL: postgres://agreement_test:local_test_only@127.0.0.1:5432/agreement_test
      SMTP_HOST: ''
      SMTP_USER: ''
      SMTP_PASS: ''
      GOOGLE_SERVICE_ACCOUNT_JSON: ''
      MAIL_FROM: ''
      AGREEMENT_WEBHOOK_URL: ''
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Record tested source identity
        run: |
          mkdir -p test-results
          git rev-parse HEAD | tee test-results/commit.txt
          sha256sum db.js workflow-api.js test/workflow-api.test.js | tee test-results/source-checksums.txt
      - name: Unit, upload boundary and integration tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results/tests.log
      - name: Capture exact tested source
        if: always()
        run: |
          mkdir -p test-results
          git archive --format=tar.gz --output=test-results/tested-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agreement-verification
          path: test-results/
          retention-days: 7
