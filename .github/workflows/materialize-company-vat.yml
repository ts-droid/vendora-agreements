name: Materialize reseller VAT export fix
on:
  push:
    branches: [feat/counterparty-company-import]
    paths: [.github/workflows/materialize-company-vat.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'ts-droid/vendora-agreements' && github.ref == 'refs/heads/feat/counterparty-company-import'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/counterparty-company-import
      - name: Add optional VAT to reseller parties tables
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          p=pathlib.Path('index.html')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '6e2f370e9a5a4fd9903ed82b3c0fe3d58ef178e20f72f845a9e449025b51b8ef'
          s=p.read_text()
          before=r'h.par((data.country||"\u2014")+(data.addr?" \u2014 "+data.addr:"")),(data.sig_name?'
          after=r'h.par((data.country||"\u2014")+(data.addr?" \u2014 "+data.addr:"")),...(data.vat?[h.par("VAT / Tax ID: "+data.vat)]:[]),(data.sig_name?'
          assert s.count(before)==1
          s=s.replace(before,after)
          before="(data.addr?h.par(data.addr):h.sp()),h.sp(),h.par([{t:'(the “Reseller”)'"
          after="(data.addr?h.par(data.addr):h.sp()),...(data.vat?[h.par(\"VAT / Tax ID: \"+data.vat)]:[]),h.sp(),h.par([{t:'(the “Reseller”)'"
          assert s.count(before)==1
          s=s.replace(before,after)
          assert hashlib.sha256(s.encode()).hexdigest() == '543ec43bb20adb86cd73de4fe746c400a2456c3cb5a798186c9bd960cd682d76'
          p.write_text(s)
          subprocess.run(['git','add','index.html'],check=True)
          subprocess.run(['git','rm','.github/workflows/materialize-company-vat.yml'],check=True)
          PY
      - name: Commit the checked fix and remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: include saved customer VAT in both reseller Word exports'
          git push origin HEAD:refs/heads/feat/counterparty-company-import
