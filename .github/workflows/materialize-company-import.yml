name: Materialize company import
on:
  push:
    branches: [feat/counterparty-company-import]
    paths: [.github/workflows/materialize-company-import.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'ts-droid/vendora-agreements' && github.ref == 'refs/heads/feat/counterparty-company-import'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/counterparty-company-import
          fetch-depth: 0
      - name: Apply exact checksum-verified changes
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = 'a6bbddb33c99485b0e4bec5fe9319445e9720e32'
          assert git('branch','--show-current') == 'feat/counterparty-company-import'
          changed = set(git('diff', '--name-only', base).splitlines())
          assert changed == {'.maintenance/company-import.patch.xz.b64','.github/workflows/materialize-company-import.yml'}
          raw = pathlib.Path('.maintenance/company-import.patch.xz.b64').read_text().strip()
          payload = lzma.decompress(base64.b64decode(raw, validate=True))
          assert len(payload) == 48141
          assert hashlib.sha256(payload).hexdigest() == '6f65a2d401d425fccf6de045ddae8f8426d75408c88a540bbcd895c68d8ea626'
          patch = pathlib.Path('/tmp/company-import-verified.patch')
          patch.write_bytes(payload)
          subprocess.run(['git','apply','--unidiff-zero','--check','--index',str(patch)],check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index',str(patch)],check=True)
          subprocess.run(['git','rm','.maintenance/company-import.patch.xz.b64','.github/workflows/materialize-company-import.yml'],check=True)
          expected = {'ai.js','counterparty-details.js','docs/counterparty-company-import.md','index.html','server.js','test/counterparty-details.test.js','test/fixtures/counterparty-details.js','test/workflow-api.test.js','workflow-api.js','workflow-core.js','workflow-ui.js'}
          assert set(git('diff','--cached','--name-only',base).splitlines()) == expected
          assert not git('diff','--name-only')
          PY
      - name: Commit and push feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: extract and approve counterparty company details during contract review'
          git push origin HEAD:refs/heads/feat/counterparty-company-import
