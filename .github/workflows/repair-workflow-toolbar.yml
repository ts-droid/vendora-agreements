name: Verify unobscured workflow controls
on:
  push:
    branches: [fix/review-progress-and-approvals]
    paths: [.github/workflows/repair-workflow-toolbar.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'ts-droid/vendora-agreements' && github.ref == 'refs/heads/fix/review-progress-and-approvals'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agreement_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: agreement_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agreement_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      ANTHROPIC_API_KEY: ''
      DATABASE_URL: ''
      TEST_DATABASE_URL: postgres://agreement_test:local_test_only@127.0.0.1:5432/agreement_test
      SMTP_HOST: ''
      AGREEMENT_WEBHOOK_URL: ''
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-progress-and-approvals
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply verified toolbar fix and regression assertions
        run: |
          python3 - <<'PY'
          import base64,lzma,hashlib,subprocess
          from pathlib import Path
          encoded=''
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==10261
          assert hashlib.sha256(patch).hexdigest()=='f3b48cf9f54b7ee776841ec78d53b457f8e2fea7a6a83f55b821081d9819b29e'
          p=Path('/tmp/workflow-toolbar.patch');p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          subprocess.run(['git','rm','.github/workflows/repair-workflow-toolbar.yml'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='507358b81193ac7cf21fbf17638e214cfc8fbf70'
          PY
      - name: Commit verified source on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: unpin legacy export bar during workflow reviews so decisions stay clickable'
          git push origin HEAD:refs/heads/fix/review-progress-and-approvals
      - run: npm ci
      - name: Full isolated tests
        run: |
          mkdir -p test-results
          set -o pipefail
          npm test 2>&1 | tee test-results/tests.log
      - name: Record exact tested source
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/commit.txt
          git archive --format=tar.gz --output=test-results/tested-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-toolbar-verification
          path: test-results/
          retention-days: 7
