name: Capture review diagnostics
on:
  push:
    branches: [fix/review-progress-and-approvals]
    paths: [.github/workflows/capture-review-diagnostics.yml]
permissions:
  contents: write
jobs:
  capture:
    if: github.repository == 'ts-droid/vendora-agreements' && github.ref == 'refs/heads/fix/review-progress-and-approvals'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agreement_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: agreement_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agreement_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      ANTHROPIC_API_KEY: ''
      DATABASE_URL: ''
      TEST_DATABASE_URL: postgres://agreement_test:local_test_only@127.0.0.1:5432/agreement_test
      SMTP_HOST: ''
      AGREEMENT_WEBHOOK_URL: ''
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-progress-and-approvals
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply verified failure diagnostics only
        run: |
          python3 - <<'PY'
          import base64,json,hashlib,subprocess
          from pathlib import Path
          encoded=''
          p=Path('test/workflow-api.test.js');before=p.read_bytes()
          assert hashlib.sha256(before).hexdigest()=='4deebd16567fe5858e06a7a4101c284f6d57c4c9788d89dd1ec1855691cba817'
          source=before.decode()
          for old,new in json.loads(base64.b64decode(encoded,validate=True)):
              assert source.count(old)==1
              source=source.replace(old,new)
          assert hashlib.sha256(source.encode()).hexdigest()=='7f2e9ae720dce63e1e82a4208c597388b4c021b3a3a1f80e54100a17b9d974fd'
          p.write_text(source)
          subprocess.run(['git','add',str(p)],check=True)
          subprocess.run(['git','rm','.github/workflows/capture-review-diagnostics.yml'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='30e90697b9d60282441880bdc4f453bc500b03e6'
          PY
      - name: Commit diagnostics on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: capture browser and saved-case state on integration failures'
          git push origin HEAD:refs/heads/fix/review-progress-and-approvals
      - run: npm ci
      - name: Full isolated tests
        run: |
          mkdir -p test-results
          set -o pipefail
          npm test 2>&1 | tee test-results/tests.log
      - name: Record exact tested source
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/commit.txt
          git archive --format=tar.gz --output=test-results/tested-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-diagnostics
          path: test-results/
          retention-days: 7
